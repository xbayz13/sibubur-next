<!DOCTYPE html>
<html>
<head>
  <title>PWA Icon Generator</title>
</head>
<body>
  <h1>PWA Icon Generator</h1>
  <p>Buka file ini di browser dan gunakan canvas untuk generate icon</p>
  <canvas id="icon192" width="192" height="192"></canvas>
  <canvas id="icon512" width="512" height="512"></canvas>
  <script>
    function createIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      // Background
      ctx.fillStyle = '#4f46e5';
      ctx.fillRect(0, 0, size, size);
      // Text
      ctx.fillStyle = '#ffffff';
      ctx.font = `bold ${size * 0.4}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('S', size / 2, size / 2);
    }
    createIcon(document.getElementById('icon192'), 192);
    createIcon(document.getElementById('icon512'), 512);
    // Download function
    function downloadIcon(canvas, filename) {
      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      });
    }
    // Auto download after 1 second
    setTimeout(() => {
      downloadIcon(document.getElementById('icon192'), 'icon-192x192.png');
      setTimeout(() => {
        downloadIcon(document.getElementById('icon512'), 'icon-512x512.png');
      }, 500);
    }, 1000);
  </script>
</body>
</html>
